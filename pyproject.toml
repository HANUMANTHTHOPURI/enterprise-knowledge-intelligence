[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"


[project]
name = "enterprise-knowledge-intelligence"
version = "1.0.0"
description = "Enterprise RAG platform using FAISS, cross-encoder reranking, LangGraph, OpenAI, and FastAPI."
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sentence-transformers",
    "faiss-cpu",
    "rank-bm25",
    "openai",
    "langgraph",
    "fastapi",
    "uvicorn[standard]",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "matplotlib",
    "ruff",
]


[tool.setuptools.packages.find]
include = ["app*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
target-version = "py312"
line-length = 88


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]